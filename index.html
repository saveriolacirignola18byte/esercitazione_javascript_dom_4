<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>JavaScript DOM</title>

</head>

<body>

    <header>

        <h1>Countdown</h1>

    </header>

    <main>
        
        <section>

            <label for="inputSecondi">Secondi:</label>

            <input type="number" id="inputSecondi" min="1" step="1" placeholder="Es. 10">

        </section>

        <section>

            <p>Tempo rimasto: <output id="display">0</output></p>

        </section>

        <section>

            <button type="button" id="btnAvvia">Avvia</button>

            <button type="button" id="btnPausa">Pausa</button>

            <button type="button" id="btnReset">Reset</button>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
